name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-bin-links

      - name: Run tests
        run: npm test

      - name: Install isolated browser
        run: node node_modules/playwright/cli.js install --with-deps chromium

      - name: Run current browser contracts
        run: node test/e2e/current-contracts.e2e.cjs
